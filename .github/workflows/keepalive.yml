name: Keep Alive

# 职责：
# 1) 每次运行先检查 run.yml / keepalive.yml 自身是否被 GitHub 禁用，若是则自动重新启用（自愈）
# 2) 距离上次 keepalive 提交超过 20 天时，提交一次时间戳，维持仓库活动
# 3) 本 workflow 自身每天运行一次，既能及时发现禁用状态，也能避免自己因不活跃被禁

on:
  schedule:
    # UTC 04:00 = 北京时间 12:00，每天一次
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Re-enable disabled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for wf in run.yml keepalive.yml; do
            state=$(gh api "repos/$REPO/actions/workflows/$wf" --jq .state 2>/dev/null || echo "unknown")
            echo "$wf -> $state"
            case "$state" in
              disabled_inactivity|disabled_manually)
                if gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" >/dev/null 2>&1; then
                  echo "::notice::$wf 已被禁用（$state），已自动重新启用"
                else
                  echo "::warning::$wf 处于 $state，自动启用失败，请检查 token 权限"
                fi
                ;;
              active)
                echo "$wf 正常，无需处理"
                ;;
              *)
                echo "::warning::$wf 状态读取失败：$state"
                ;;
            esac
          done

      - name: Decide whether to commit
        id: gate
        run: |
          if [ -f .github/keepalive.txt ]; then
            last=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' .github/keepalive.txt | head -1)
            last_epoch=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            now_epoch=$(date -u +%s)
            days=$(( (now_epoch - last_epoch) / 86400 ))
          else
            days=999
          fi
          echo "距上次保活提交：${days} 天"
          if [ "$days" -ge 20 ]; then
            echo "need_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write timestamp
        if: steps.gate.outputs.need_commit == 'true'
        run: |
          mkdir -p .github
          printf 'last keepalive: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt
          cat .github/keepalive.txt

      - name: Commit and push
        if: steps.gate.outputs.need_commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "no change, skip"
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
          fi
